plugins {
    id 'com.gradleup.nmcp.settings' version '1.6.1'
}

nmcpSettings {
    centralPortal {
        username = System.getenv("MAVEN_USERNAME")
        password = System.getenv("MAVEN_PASSWORD")
        publishingType = "USER_MANAGED"
    }
}

String rootName = 'artifactory-java-client'
String api = 'api'
String services = 'services'
String httpClient = 'httpClient'

include api, services, httpClient
rootProject.name = rootName

project(":$api").name = "$rootName-$api"
project(":$services").name = "$rootName-$services"
project(":$httpClient").name = "$rootName-$httpClient"

