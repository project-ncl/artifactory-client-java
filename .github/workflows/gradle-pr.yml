name: Java CI with Gradle

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-gradle:
    if: github.repository == 'project-ncl/artifactory-client-java'
    uses: project-ncl/shared-github-actions/.github/workflows/gradle-ci.yml@e7102dd3bf74f91aaccae7a3539241c03a652d1a # v0.0.27
    with:
      java_version: "17"
      build_args: "--no-daemon --stacktrace clean build "
      upload_artifacts: true
