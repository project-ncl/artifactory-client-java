name: Build snapshot version and upload to Gradle Central

permissions: {}

on:
  push:
    branches: [master]

jobs:
  call-snapshot-job:
    uses: project-ncl/shared-github-actions/.github/workflows/gradle-snapshot.yml@e7102dd3bf74f91aaccae7a3539241c03a652d1a # v0.0.27
    with:
      project_name: "project-ncl/artifactory-client-java"
      java_version: "17"
      snapshot_deploy_args: "--info build publishAggregationToCentralPortalSnapshots"
    secrets:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
